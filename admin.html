<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RidaSwift Admin Dashboard</title>
<style>
  :root {
    --ink: #0A0A0A; --cream: #F5F0E8; --saffron: #E8A020;
    --rust: #C43B1A; --slate: #1C2B3A; --fog: #D6D0C4;
    --green: #25D366; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: var(--cream); font-family: Arial, sans-serif; min-height: 100vh; }

  /* LOGIN */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 2rem;
  }
  .login-box {
    background: var(--slate); border: 2px solid var(--saffron);
    padding: 2.5rem; width: 100%; max-width: 360px; text-align: center;
  }
  .login-logo { width: 80px; margin: 0 auto 1rem; display: block; }
  .login-title {
    font-size: 1.5rem; font-weight: 900; letter-spacing: .1em;
    color: var(--cream); margin-bottom: .3rem;
  }
  .login-title span { color: var(--saffron); }
  .login-subtitle { font-size: .8rem; color: var(--fog); margin-bottom: 1.8rem; }
  .login-input {
    width: 100%; background: transparent;
    border: none; border-bottom: 2px solid rgba(245,240,232,.2);
    color: var(--cream); font-size: 1rem; padding: .8rem 0;
    outline: none; margin-bottom: 1.5rem; text-align: center;
    letter-spacing: .2em;
  }
  .login-input:focus { border-color: var(--saffron); }
  .login-btn {
    width: 100%; background: var(--saffron); color: var(--ink);
    font-weight: 700; font-size: 1rem; letter-spacing: .1em;
    text-transform: uppercase; border: none; padding: 1rem;
    cursor: pointer; transition: background .2s;
  }
  .login-btn:hover { background: var(--rust); color: var(--cream); }
  .login-error {
    color: var(--rust); font-size: .82rem;
    margin-top: .8rem; display: none;
  }

  /* DASHBOARD */
  #dashboard { display: none; }
  .dash-nav {
    background: var(--ink); border-bottom: 3px solid var(--saffron);
    padding: 1rem 4vw; display: flex;
    align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .dash-title { font-size: 1.2rem; font-weight: 900; letter-spacing: .08em; }
  .dash-title span { color: var(--saffron); }
  .logout-btn {
    background: none; border: 1px solid var(--fog);
    color: var(--fog); font-size: .8rem; padding: .4rem .9rem;
    cursor: pointer; transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--rust); color: var(--rust); }

  .dash-body { padding: 1.5rem 4vw; }

  /* STATS */
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1rem; margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--slate); border: 1px solid rgba(232,160,32,.2);
    padding: 1.2rem; text-align: center;
  }
  .stat-icon { font-size: 1.8rem; margin-bottom: .4rem; }
  .stat-num {
    font-size: 2rem; font-weight: 900; color: var(--saffron); line-height: 1;
  }
  .stat-label { font-size: .7rem; letter-spacing: .1em; color: var(--fog); margin-top: .2rem; }

  /* FILTER TABS */
  .filter-tabs {
    display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .filter-tab {
    background: transparent; border: 1px solid rgba(245,240,232,.15);
    color: var(--fog); font-size: .78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    padding: .45rem 1rem; cursor: pointer; transition: all .2s;
  }
  .filter-tab.active { background: var(--saffron); color: var(--ink); border-color: var(--saffron); }

  /* BOOKING CARDS */
  .bookings-list { display: flex; flex-direction: column; gap: 1rem; }
  .booking-card {
    background: var(--slate); border: 1px solid rgba(245,240,232,.08);
    padding: 1.2rem; transition: border-color .2s;
  }
  .booking-card:hover { border-color: var(--saffron); }
  .booking-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: .8rem;
  }
  .booking-type {
    font-size: .7rem; font-weight: 700; letter-spacing: .15em;
    text-transform: uppercase; padding: .25rem .7rem;
  }
  .type-ride { background: rgba(37,211,102,.15); color: var(--green); }
  .type-rider { background: rgba(232,160,32,.15); color: var(--saffron); }
  .type-delivery { background: rgba(196,59,26,.15); color: var(--rust); }
  .booking-date { font-size: .72rem; color: #666; }
  .booking-name { font-weight: 700; font-size: 1rem; margin-bottom: .3rem; }
  .booking-detail { font-size: .82rem; color: var(--fog); margin-bottom: .2rem; }
  .booking-detail span { color: var(--cream); }
  .booking-actions { display: flex; gap: .6rem; margin-top: 1rem; }
  .action-btn {
    flex: 1; padding: .55rem; font-size: .78rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    border: none; cursor: pointer; text-decoration: none;
    text-align: center; transition: opacity .2s;
  }
  .action-btn:hover { opacity: .8; }
  .btn-wa { background: var(--green); color: #fff; }
  .btn-call { background: var(--saffron); color: var(--ink); }
  .btn-delete { background: rgba(239,68,68,.15); color: #ef4444; border: 1px solid #ef4444; }

  .status-badge {
    display: inline-block; font-size: .65rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    padding: .2rem .6rem; margin-left: .5rem;
  }
  .status-new { background: rgba(37,211,102,.15); color: var(--green); }
  .status-done { background: rgba(232,160,32,.15); color: var(--saffron); }

  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--fog);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

  .clear-all-btn {
    background: rgba(239,68,68,.1); color: #ef4444;
    border: 1px solid #ef4444; padding: .5rem 1.2rem;
    font-size: .78rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer;
  }

  .dash-footer {
    text-align: center; padding: 2rem; color: #333; font-size: .75rem;
  }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .stat-card { padding: .8rem .5rem; }
    .stat-num { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <img src="ridaswift-logo.png" alt="RidaSwift" class="login-logo"/>
    <div class="login-title">Rida<span>Swift</span></div>
    <div class="login-subtitle">Admin Dashboard — Owner Access Only</div>
    <input type="password" id="passwordInput" class="login-input"
      placeholder="Enter password"
      onkeydown="if(event.key==='Enter') login()"/>
    <button class="login-btn" onclick="login()">🔐 Login</button>
    <div class="login-error" id="loginError">❌ Wrong password. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav class="dash-nav">
    <div class="dash-title">Rida<span>Swift</span> Admin</div>
    <div style="display:flex;gap:.8rem;align-items:center;">
      <button class="clear-all-btn" onclick="clearAll()">🗑️ Clear All</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="dash-body">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏍️</div>
        <div class="stat-num" id="statRides">0</div>
        <div class="stat-label">Ride Bookings</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👤</div>
        <div class="stat-num" id="statRiders">0</div>
        <div class="stat-label">Applications</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-num" id="statDeliveries">0</div>
        <div class="stat-label">Deliveries</div>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterBookings('all', this)">All</button>
      <button class="filter-tab" onclick="filterBookings('Ride Booking', this)">🏍️ Rides</button>
      <button class="filter-tab" onclick="filterBookings('Rider Application', this)">👤 Riders</button>
      <button class="filter-tab" onclick="filterBookings('Delivery Request', this)">📦 Deliveries</button>
    </div>

    <!-- Bookings list -->
    <div class="bookings-list" id="bookingsList"></div>
  </div>

  <div class="dash-footer">
    RidaSwift Admin Panel · Designed by Evans Abok
  </div>
</div>

<script>
  var PASS = 'rahmahjihdin164';
  var currentFilter = 'all';

  function login() {
    var pwd = document.getElementById('passwordInput').value;
    if (pwd === PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      sessionStorage.setItem('rs_admin', '1');
      loadDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('passwordInput').value = '';
    }
  }

  function logout() {
    sessionStorage.removeItem('rs_admin');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  // Auto login if session active
  if (sessionStorage.getItem('rs_admin')) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  function loadDashboard() {
    var bookings = JSON.parse(localStorage.getItem('rs_bookings') || '[]');

    // Stats
    document.getElementById('statRides').textContent =
      bookings.filter(function(b) { return b.type === 'Ride Booking'; }).length;
    document.getElementById('statRiders').textContent =
      bookings.filter(function(b) { return b.type === 'Rider Application'; }).length;
    document.getElementById('statDeliveries').textContent =
      bookings.filter(function(b) { return b.type === 'Delivery Request'; }).length;

    renderBookings(bookings, currentFilter);
  }

  function renderBookings(bookings, filter) {
    var list = document.getElementById('bookingsList');
    var filtered = filter === 'all' ? bookings :
      bookings.filter(function(b) { return b.type === filter; });

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>No ' + (filter === 'all' ? '' : filter.toLowerCase() + ' ') + 'submissions yet</div></div>';
      return;
    }

    list.innerHTML = filtered.map(function(b, i) {
      var typeClass = b.type === 'Ride Booking' ? 'type-ride' :
                      b.type === 'Rider Application' ? 'type-rider' : 'type-delivery';
      var details = '';
      if (b.type === 'Ride Booking') {
        details = '<div class="booking-detail">📍 Pickup: <span>' + (b.pickup||'-') + '</span></div>' +
                  '<div class="booking-detail">🏁 Drop-off: <span>' + (b.dropoff||'-') + '</span></div>' +
                  '<div class="booking-detail">🕐 When: <span>' + (b.when||'-') + '</span></div>' +
                  '<div class="booking-detail">💳 Payment: <span>' + (b.payment||'-') + '</span></div>';
      } else if (b.type === 'Rider Application') {
        details = '<div class="booking-detail">📍 Area: <span>' + (b.area||'-') + '</span></div>' +
                  '<div class="booking-detail">⏱️ Experience: <span>' + (b.experience||'-') + '</span></div>' +
                  '<div class="booking-detail">📋 Licence: <span>' + (b.licence||'-') + '</span></div>';
      } else {
        details = '<div class="booking-detail">📦 <span>' + (b.details||'Check WhatsApp') + '</span></div>';
      }

      var phone = (b.phone || '').replace(/\D/g, '');
      if (phone.startsWith('0')) phone = '254' + phone.slice(1);

      return '<div class="booking-card">' +
        '<div class="booking-header">' +
          '<span class="booking-type ' + typeClass + '">' + b.type + '</span>' +
          '<span class="booking-date">' + (b.date||'') + '</span>' +
        '</div>' +
        '<div class="booking-name">' + (b.name||'Unknown') +
          '<span class="status-badge status-new">' + (b.status||'New') + '</span>' +
        '</div>' +
        '<div class="booking-detail">📞 Phone: <span>' + (b.phone||'-') + '</span></div>' +
        details +
        '<div class="booking-actions">' +
          '<a class="action-btn btn-wa" href="https://wa.me/' + phone + '" target="_blank">💬 WhatsApp</a>' +
          '<a class="action-btn btn-call" href="tel:+' + phone + '">📞 Call</a>' +
          '<button class="action-btn btn-delete" onclick="deleteBooking(' + b.id + ')">🗑️ Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function filterBookings(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    var bookings = JSON.parse(localStorage.getItem('rs_bookings') || '[]');
    renderBookings(bookings, type);
  }

  function deleteBooking(id) {
    var bookings = JSON.parse(localStorage.getItem('rs_bookings') || '[]');
    bookings = bookings.filter(function(b) { return b.id !== id; });
    localStorage.setItem('rs_bookings', JSON.stringify(bookings));
    loadDashboard();
  }

  function clearAll() {
    if (confirm('Delete ALL bookings? This cannot be undone.')) {
      localStorage.removeItem('rs_bookings');
      loadDashboard();
    }
  }

  // Refresh every 30 seconds
  setInterval(loadDashboard, 30000);
</script>
</body>
</html>
